<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniMail — Authentication & Onboarding</title>
  <link rel="stylesheet" href="/index.css">
</head>
<body class="auth-body" style="background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 60%), var(--bg-dark);">

  <div style="text-align: center; margin-top: 40px;">
    <a href="/" style="text-decoration: none; display: inline-flex; align-items: center; gap: 10px;">
      <div class="brand-icon" style="width: 40px; height: 40px; font-size: 22px;">⚡</div>
      <h1 style="font-family: var(--font-heading); font-size: 24px; color: white; font-weight: 800;">OmniMail</h1>
    </a>
  </div>

  <div class="auth-container" id="auth-box">
    <!-- Content dynamically rendered by JS below -->
  </div>

  <script>
    // Get URL state
    const path = window.location.pathname;
    const urlParams = new URLSearchParams(window.location.search);
    const initialPlan = urlParams.get('plan') || 'free';
    const emailParam = urlParams.get('email') || '';
    const otpParam = urlParams.get('otp') || '';
    const resetTokenParam = urlParams.get('token') || '';

    let currentMode = 'login';
    if (path.includes('signup')) currentMode = 'signup';
    if (path.includes('verify')) currentMode = 'verify';
    if (path.includes('onboarding')) currentMode = 'onboarding';
    if (path.includes('reset')) currentMode = 'reset';

    function renderMode(mode, extraData = {}) {
      currentMode = mode;
      const box = document.getElementById('auth-box');
      
      if (mode === 'login') {
        box.innerHTML = `
          <h2 style="font-family: var(--font-heading); font-size: 28px; color: white; margin-bottom: 8px; text-align: center;">Welcome Back</h2>
          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-bottom: 28px;">Log in to your enterprise email workspace</p>
          
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="login-email" class="form-input" required placeholder="admin@omnimail.local" />
            </div>
            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label class="form-label">Password</label>
                <a href="javascript:renderMode('forgot')" style="color: var(--primary); font-size: 12px; text-decoration: none;">Forgot password?</a>
              </div>
              <input type="password" id="login-password" class="form-input" required placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px; font-size: 15px;">Log In →</button>
            <div id="login-error" style="color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center;"></div>
          </form>

          <div style="display: flex; align-items: center; gap: 12px; margin: 24px 0;">
            <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);" />
            <span style="color: var(--text-muted); font-size: 12px;">OR CONTINUE WITH</span>
            <hr style="flex: 1; border: 0; border-top: 1px solid var(--border-color);" />
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <button onclick="handleOAuth('google')" class="btn btn-secondary" style="padding: 10px; font-size: 13px;">🌐 Google</button>
            <button onclick="handleOAuth('github')" class="btn btn-secondary" style="padding: 10px; font-size: 13px;">🐙 GitHub</button>
          </div>

          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-top: 28px;">
            Don't have an account? <a href="javascript:renderMode('signup')" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up free</a>
          </p>
        `;
      }

      else if (mode === 'signup') {
        box.innerHTML = `
          <h2 style="font-family: var(--font-heading); font-size: 28px; color: white; margin-bottom: 8px; text-align: center;">Create Free Account</h2>
          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-bottom: 28px;">Start sending in less than 2 minutes</p>
          
          <form onsubmit="handleSignup(event)">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="signup-name" class="form-input" required placeholder="Alex Smith" />
            </div>
            <div class="form-group">
              <label class="form-label">Organization Name</label>
              <input type="text" id="signup-org" class="form-input" required placeholder="Acme Corp Enterprise" />
            </div>
            <div class="form-group">
              <label class="form-label">Work Email Address</label>
              <input type="email" id="signup-email" class="form-input" required placeholder="alex@acmecorp.com" value="${emailParam}" />
            </div>
            <div class="form-group">
              <label class="form-label">Password (6+ chars)</label>
              <input type="password" id="signup-password" class="form-input" required minlength="6" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px; font-size: 15px;">Create Account & Verify →</button>
            <div id="signup-error" style="color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center;"></div>
          </form>

          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-top: 28px;">
            Already have an account? <a href="javascript:renderMode('login')" style="color: var(--primary); text-decoration: none; font-weight: 600;">Log in</a>
          </p>
        `;
      }

      else if (mode === 'verify') {
        const email = extraData.email || emailParam || 'your email';
        const otp = extraData.otp || otpParam || '';
        box.innerHTML = `
          <div style="text-align: center; font-size: 40px; margin-bottom: 12px;">✉️</div>
          <h2 style="font-family: var(--font-heading); font-size: 26px; color: white; margin-bottom: 8px; text-align: center;">Verify Your Email</h2>
          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-bottom: 24px;">
            We sent a 6-digit verification code to <strong style="color: white;">${email}</strong>. Please enter it below to activate your account.
          </p>

          ${otp ? `<div style="background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #34d399; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; text-align: center;">
            ⚡ <strong>Evaluation Demo Mode:</strong> Your OTP code is <strong style="font-size: 16px;">${otp}</strong>
          </div>` : ''}
          
          <form onsubmit="handleVerify(event, '${email}')">
            <div class="form-group">
              <label class="form-label" style="text-align: center;">6-Digit OTP Verification Code</label>
              <input type="text" id="verify-otp" class="form-input" required maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 6px; font-weight: 700;" placeholder="123456" value="${otp}" />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px; font-size: 15px;">Verify & Continue →</button>
            <div id="verify-error" style="color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center;"></div>
          </form>
        `;
      }

      else if (mode === 'forgot') {
        box.innerHTML = `
          <h2 style="font-family: var(--font-heading); font-size: 26px; color: white; margin-bottom: 8px; text-align: center;">Reset Password</h2>
          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-bottom: 28px;">Enter your email to receive reset instructions</p>
          
          <form onsubmit="handleForgot(event)">
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="forgot-email" class="form-input" required placeholder="alex@acmecorp.com" />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px; font-size: 15px;">Send Reset Link</button>
            <div id="forgot-status" style="margin-top: 16px; text-align: center; font-size: 13px;"></div>
          </form>

          <p style="text-align: center; margin-top: 24px;"><a href="javascript:renderMode('login')" style="color: var(--text-secondary); font-size: 13px; text-decoration: none;">← Back to Log In</a></p>
        `;
      }

      else if (mode === 'reset') {
        box.innerHTML = `
          <h2 style="font-family: var(--font-heading); font-size: 26px; color: white; margin-bottom: 8px; text-align: center;">Set New Password</h2>
          <p style="color: var(--text-secondary); font-size: 14px; text-align: center; margin-bottom: 28px;">Enter your new password below</p>
          
          <form onsubmit="handleReset(event)">
            <div class="form-group">
              <label class="form-label">New Password (6+ chars)</label>
              <input type="password" id="reset-new-pwd" class="form-input" required minlength="6" placeholder="••••••••" />
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px; padding: 12px; font-size: 15px;">Update Password & Log In</button>
            <div id="reset-status" style="margin-top: 16px; text-align: center; font-size: 13px;"></div>
          </form>
        `;
      }

      else if (mode === 'onboarding') {
        box.style.maxWidth = '800px';
        box.innerHTML = `
          <h2 style="font-family: var(--font-heading); font-size: 32px; color: white; margin-bottom: 8px; text-align: center;">Choose Your Plan</h2>
          <p style="color: var(--text-secondary); font-size: 15px; text-align: center; margin-bottom: 32px;">Select an infrastructure tier for your organization. You can upgrade or downgrade anytime.</p>
          
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
            <!-- Free -->
            <div class="card" style="padding: 24px; text-align: left; display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="font-weight: 700; color: var(--text-secondary);">FREE TIER</div>
                <div style="font-size: 28px; font-weight: 800; color: white; margin: 8px 0;">$0<span style="font-size: 14px; color: var(--text-secondary);">/mo</span></div>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">5,000 emails/mo, 1 automation workflow.</p>
              </div>
              <button onclick="selectPlan('free')" class="btn btn-secondary" style="width: 100%;">Select Free Plan</button>
            </div>

            <!-- Pro -->
            <div class="card" style="padding: 24px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid var(--primary); box-shadow: 0 0 20px var(--primary-glow);">
              <div>
                <div style="font-weight: 700; color: var(--accent-pink);">MID TIER (PRO)</div>
                <div style="font-size: 28px; font-weight: 800; color: white; margin: 8px 0;">$49<span style="font-size: 14px; color: var(--text-secondary);">/mo</span></div>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">100,000 emails/mo, Included FREE Dedicated IP!</p>
              </div>
              <button onclick="selectPlan('mid')" class="btn btn-primary" style="width: 100%;">Select Pro Plan ★</button>
            </div>

            <!-- Enterprise -->
            <div class="card" style="padding: 24px; text-align: left; display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <div style="font-weight: 700; color: #38bdf8;">ENTERPRISE</div>
                <div style="font-size: 28px; font-weight: 800; color: white; margin: 8px 0;">Custom</div>
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">Unlimited volume, Included FREE SAML SSO!</p>
              </div>
              <button onclick="selectPlan('enterprise')" class="btn btn-secondary" style="width: 100%;">Select Enterprise</button>
            </div>
          </div>

          <div id="onboard-status" style="margin-top: 24px; text-align: center; font-weight: 600;"></div>
        `;
      }
    }

    // API Handlers
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.innerText = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('omni_session_token', data.token);
          if (data.data.org.onboarding_step === 'plan_selection') {
            renderMode('onboarding');
          } else {
            window.location.href = '/app';
          }
        } else if (data.requires_verification) {
          renderMode('verify', { email: data.email });
        } else {
          errorEl.innerText = data.message || 'Login failed.';
        }
      } catch (err) {
        errorEl.innerText = 'Network error during login.';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const org_name = document.getElementById('signup-org').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const errorEl = document.getElementById('signup-error');
      errorEl.innerText = '';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, org_name, email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('omni_session_token', data.token);
          if (data.data.org.onboarding_step === 'plan_selection') {
            renderMode('onboarding');
          } else {
            window.location.href = '/app';
          }
        } else {
          errorEl.innerText = data.message || 'Signup failed.';
        }
      } catch (err) {
        errorEl.innerText = 'Network error during signup.';
      }
    }

    async function handleVerify(e, email) {
      e.preventDefault();
      const token = document.getElementById('verify-otp').value;
      const errorEl = document.getElementById('verify-error');
      errorEl.innerText = '';

      try {
        const res = await fetch('/api/auth/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('omni_session_token', data.token);
          renderMode('onboarding');
        } else {
          errorEl.innerText = data.message || 'Verification failed.';
        }
      } catch (err) {
        errorEl.innerText = 'Network error during verification.';
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      const statusEl = document.getElementById('forgot-status');
      
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if (data.data && data.data.reset_token) {
        statusEl.style.color = 'var(--success)';
        statusEl.innerHTML = `✓ Reset link generated! <a href="/reset-password?token=${data.data.reset_token}&email=${encodeURIComponent(email)}" style="color: #38bdf8; font-weight: 700;">Click here to set new password →</a>`;
      } else {
        statusEl.style.color = 'var(--success)';
        statusEl.innerText = data.message;
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const new_password = document.getElementById('reset-new-pwd').value;
      const statusEl = document.getElementById('reset-status');

      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailParam, token: resetTokenParam, new_password })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        statusEl.style.color = 'var(--success)';
        statusEl.innerText = '✓ Password updated! Redirecting to login...';
        setTimeout(() => renderMode('login'), 1500);
      } else {
        statusEl.style.color = 'var(--danger)';
        statusEl.innerText = data.message || 'Reset failed.';
      }
    }

    async function handleOAuth(provider) {
      const res = await fetch(`/api/auth/oauth/${provider}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: `demo_${provider}_user@omnimail.local`, name: `${provider.toUpperCase()} Developer` })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        localStorage.setItem('omni_session_token', data.token);
        if (data.data.org.onboarding_step === 'plan_selection') {
          renderMode('onboarding');
        } else {
          window.location.href = '/app';
        }
      }
    }

    async function selectPlan(planTier) {
      const statusEl = document.getElementById('onboard-status');
      statusEl.style.color = 'var(--primary)';
      statusEl.innerText = `Activating ${planTier.toUpperCase()} tier...`;

      const token = localStorage.getItem('omni_session_token') || 'omni_live_master_key_9988776655';
      const res = await fetch('/api/auth/onboard-plan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ plan_tier: planTier, billing_cycle: 'monthly' })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        statusEl.style.color = 'var(--success)';
        statusEl.innerText = '✓ Plan activated! Redirecting to dashboard...';
        setTimeout(() => window.location.href = '/app', 1000);
      } else {
        statusEl.style.color = 'var(--danger)';
        statusEl.innerText = data.message || 'Plan activation failed.';
      }
    }

    // Initial render
    renderMode(currentMode);
  </script>
</body>
</html>
